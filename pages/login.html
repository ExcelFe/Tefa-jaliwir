<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Globaliti Badung</title>

    <!-- Core Open Graphs -->
    <meta property="og:title" content="SMK TI Bali Global Badung">
    <meta property="og:description" content="Akses Dashboard menggunakan akun Globaliti.">
    <meta property="og:image" content="">
    <meta property="og:url" content="">
    <meta property="og:type" content="">
    <!-- Extra Open Graphs for X/Twitter -->
    <meta property="twitter:card" content="">
    <meta property="twitter:image" content="">

    <!-- FAVICON HERE -->
     <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=20261103" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg?v=20261103" />
    <link rel="shortcut icon" href="/favicon/favicon.ico?v=20261103" />

    <link rel="stylesheet" href="../css/webpage.css">
    <link rel="stylesheet" href="../css/public-page-transition.css">

    <link rel="stylesheet" href="../css/animation.css">
    <script defer src="../js/main.js"></script>
    <script defer src="../js/login.js"></script>
    <script defer src="../js/animation.js"></script>

</head>
<body class="page-login theme-warm">
    <main class="login-main">
        <!-- Card: 2 columns. Left = logo + school name | Right = back button, headline, form -->
        <div class="login-card">
            <!-- LEFT: school logo + name -->
            <section class="login-brand">
                <div class="login-logo">
                    <img src="../media/logo.webp" alt="Logo SMK TI Bali Global Badung" width="136" height="136">
                </div>
                <p class="login-school">SMK TI BALI <span>GLOBAL BADUNG</span></p>
            </section>

            <!-- RIGHT: back button (js/login.js), headline, form -->
            <section class="login-panel">
                <!-- Back: previous page, home if there is no history -->
                <a class="back-btn" href="../index.html" data-back aria-label="Kembali ke halaman sebelumnya"></a>

                <div class="login-head">
                    <h1>Masuk ke Akun</h1>
                    <p>Masukan alamat email & password untuk mendapatkan akses dashboard Globaliti.</p>
                </div>

                <!-- Email + password, Sign In, Forgot Password (no backend yet) -->
                <form class="login-form" method="post">
                    <div class="login-fields">
                        <label class="login-field login-field--email">
                            <img src="../media/vector/email-icon.png" alt="" width="16" height="16">
                            <input type="email" name="email" id="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
                        </label>
                        <label class="login-field login-field--password">
                            <img src="../media/vector/lock-icon.png" alt="" width="10" height="10">
                            <input type="password" name="password" id="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
                            <button type="button" class="password-toggle" id="password-toggle" aria-label="Tampilkan password" aria-pressed="false">
                                <img src="../media/vector/eye-off.png" alt="" class="password-toggle__icon" width="20" height="20">
                            </button>
                        </label>
                    </div>
                    <div class="login-actions">
                        <button type="submit" class="btn-signin">Sign In</button>
                    </div>
                    <!-- Screen-reader copy of the field message (js/login.js) -->
                    <p class="login-status" role="status" aria-live="polite" data-login-status></p>
                </form>
            </section>
        </div>
    </main>
    <div class="page-transition" data-page-transition aria-hidden="true">
        <div class="page-transition__panels" aria-hidden="true">
            <span class="page-transition__panel"></span>
            <span class="page-transition__panel"></span>
            <span class="page-transition__panel"></span>
            <span class="page-transition__panel"></span>
            <span class="page-transition__panel"></span>
        </div>
        <div class="page-transition__label">SMK TI BALI GLOBAL BADUNG</div>
    </div>
    <script defer src="../js/public-page-transition.js"></script>
</body>
</html>
