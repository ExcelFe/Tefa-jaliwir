<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin - Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/main.css">
    <script defer src="../../js/dashboard.js"></script>
</head>
<body>
    <header>
        <a href="../../index.html">&larr; Beranda</a>
        <h1>Dashboard Admin</h1>
        <nav>
            <a href="#">Menu Utama</a>
            <a href="#">Absensi</a>
        </nav>
    </header>

    <main>
        <!-- Tampilan Utama (Desktop) -->
        <section>
            <h2>Status Guru Hari Ini</h2>
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Guru</th>
                        <th>Status Kehadiran</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Contoh loop data dari database -->
                    <!-- @foreach($guruList as $guru) -->
                    <tr>
                        <td>1</td>
                        <td>Nama Guru Contoh</td>
                        <td>Hadir</td>
                    </tr>
                    <!-- @endforeach -->
                </tbody>
            </table>
        </section>

        <!-- Tombol Pemicu Pop-up (Pengganti Desktop-1 & Desktop-2) -->
        <section>
            <h2>Aksi Menu</h2>
            <button type="button" onclick="openModal('popup-formulir')">Buka Formulir</button>
            <button type="button" onclick="openModal('popup-download')">Unduh Spreadsheet</button>
        </section>
    </main>

    <!-- POPUP 1: Formulir (Eks Desktop-1) -->
    <div id="popup-formulir" class="modal">
        <div class="modal-content">
            <h3>Formulir Admin</h3>
            <form action="/admin/store" method="POST">
                <div>
                    <label>Nama / Judul:</label><br>
                    <input type="text" name="nama" required>
                </div>
                <div>
                    <label>Kategori:</label><br>
                    <select name="kategori">
                        <option value="">Pilih Kategori</option>
                    </select>
                </div>
                <div>
                    <label>Keterangan:</label><br>
                    <textarea name="keterangan" rows="3"></textarea>
                </div>
                <br>
                <button type="submit">Simpan Data</button>
                <button type="button" onclick="closeModal('popup-formulir')">Tutup</button>
            </form>
        </div>
    </div>

    <!-- POPUP 2: Unduh Spreadsheet (Eks Desktop-2) -->
    <div id="popup-download" class="modal">
        <div class="modal-content">
            <h3>Unduh Data Absensi</h3>
            <p>Silakan klik tombol di bawah untuk mengunduh rekapitulasi data absensi.</p>
            <a href="/admin/download-spreadsheet" target="_blank">
                <button type="button">Unduh Spreadsheet</button>
            </a>
            <br><br>
            <button type="button" onclick="closeModal('popup-download')">Tutup</button>
        </div>
    </div>
</body>
</html>
